<!doctype html>
<html>

	<head>
		<meta charset="utf-8">
		<title></title>
		<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no" />
		<link href="css/mui.min.css" rel="stylesheet" />
		<style>
			.mui-slider-item img{
				height: 240px;
			}
			.grid-3{
				display: flex;;
				flex-wrap: wrap;
				margin-left: 20px;
			}
			.grid-item{
				width: 33%;
				margin-top: 20px;
			}
			.grid-item img{
				width: 50px;
				height: 50px;
				display: block;
				margin: auto;
				
			}
			.grid-item p{
				text-align: center;
				font-size: 16px;
				color: black;
				margin-top: 10px;
			}
			.list{
				background-color: white;
				margin: 10px;
			}
			.list-il{
				display: flex;
				padding: 10px;
			}
			.list-il img{
				width: 120px;
				height: 90px;
				
			}
			.list-il div{
				width: 65%;
				display: flex;
				flex-flow: column;
				justify-content: space-between;
				margin-left: 10px;
			}
		</style>
	</head>

	<body>
		
		<header class="mui-bar mui-bar-nav">
			<h1 class="mui-title">首页</h1>
		</header>
		<div class="mui-content">
			
			
			<div id="slider" class="mui-slider" >
			  <div class="mui-slider-group" id="sli">
				<!-- 第一张 -->
				<div class="mui-slider-item">
				  <a href="#">
					<img src="images/shuijiao.jpg">
				  </a>
				</div>
				<!-- 第二张 -->
				<div class="mui-slider-item">
				  <a href="#">
					<img src="images/cbd.jpg">
				  </a>
				</div>
				<!-- 第三张 -->
				<div class="mui-slider-item">
				  <a href="#">
					<img src="images/muwu.jpg">
				  </a>
				</div>
				<!-- 第四张 -->
				<div class="mui-slider-item">
				  <a href="#">
					<img src="images/yuantiao.jpg">
				  </a>
				</div>
			  </div>
			  <div class="mui-slider-indicator">
				<div class="mui-indicator mui-active"></div>
				<div class="mui-indicator"></div>
				<div class="mui-indicator"></div>
				<div class="mui-indicator"></div>
				<div class="mui-indicator"></div>
				<div class="mui-indicator"></div>
			  </div>
			</div>
		</div>
		
		<div class="mui-card">
			<div class="mui-card-header">
				推荐服务
			</div>
			<div class="mui-card-content">
				<div class="grid-3" id="grid">
					<div class="grid-item">
						<img src="images/QQ.png"/>
						<p>停哪儿</p>
					</div>
				</div>
			</div>
		</div>
		
		<div class="list" id="liss">
			<div class="list-il">
				<img src="images/cbd.jpg"/>
				<div>
					<p class="mui-ellipsis-2">新闻标题</p>
					<p>新闻日期：</p>
				</div>
			</div>
		</div>
		
		<div style="margin-bottom: 60px;"></div>
	
		<nav class="mui-bar mui-bar-tab">
			<a class="mui-tab-item mui-active" href ="home.html">
				<span class="mui-icon mui-icon-home"></span>
				<span class="mui-tab-label">首页</span>
			</a>
			<a class="mui-tab-item" href ="xinwen.html">
				<span class="mui-icon mui-icon-phone"></span>
				<span class="mui-tab-label">新闻</span>
			</a>
			<a class="mui-tab-item"	href ="shuju.html">
				<span class="mui-icon mui-icon-email"></span>
				<span class="mui-tab-label">数据分析</span>
			</a>
			<a class="mui-tab-item"	href ="geren.html">
				<span class="mui-icon mui-icon-gear"></span>
				<span class="mui-tab-label">个人中心</span>
			</a>
		</nav>
		
		<script src="libs/echarts.js"></script>
		
		<script src="js/mui.js"></script>
		<script type="text/javascript">
			mui.init()
			
			mui('.mui-bar-tab').on('tap','a',function(){
				window.location.href = this.href
			}) 
			
			//maja
			mui.ajax('http://124.93.196.45:10091/prod-api/api/rotation/list',{

				data:{
					
				},
				dataType:'json',//服务器返回json格式数据
				type:'GET',//HTTP请求类型
				timeout:10000,//超时时间设置为10秒；
				success:function(data){
					console.log(data)
					var html = ""
					for (var i = 0; i < data.rows.length; i++) {
						html += `
						<!-- 第一张 -->
						<div class="mui-slider-item" onclick = "onGnItem(${data.rows[i].id})">
						  <a href="#">
							<img src="http://124.93.196.45:10091${data.rows[i].advImg}">
						  </a>
						</div>
						`
					}
			
					mui("#slider").slider({
						interval:2000
					})
					document.getElementById("sli").innerHTML = html
				},
				error:function(xhr,type,errorThrown){
					
				}
			});
			mui.ajax('http://124.93.196.45:10091/prod-api/api/service/list',{
				data:{
					
				},
				dataType:'json',//服务器返回json格式数据
				type:'GET',//HTTP请求类型
				timeout:10000,//超时时间设置为10秒；
				success:function(data){
					console.log(data);
					var html = ""
					for (var i = 0; i < 5; i++) {
						html += `
							<div class="grid-item">
								<img src="http://124.93.196.45:10091${data.rows[i].imgUrl}">
								<p>${data.rows[i].serviceName}</p>
							</div>
						`
						}
						html +=`
							<div class="grid-item">
								<img src="http://124.93.196.45:10091${data.rows[5].imgUrl}">
								<p>更多服务</p>
							</div>
						`
						//dg 快捷键
						document.getElementById("grid").innerHTML = html
				},
				error:function(xhr,type,errorThrown){
					
				}
			});
		
			mui.ajax('http://124.93.196.45:10091/prod-api/press/press/list',{
				data:{
					
				},
				dataType:'json',//服务器返回json格式数据
				type:'GET',//HTTP请求类型
				timeout:10000,//超时时间设置为10秒；
				success:function(data){
					console.log(data);
					var html = ""
					for (var i = 0; i < 10; i++) {
						html += `
								<div class="list-il" onclick = "onGnItem(${data.rows[i].id})">
									<img src="http://124.93.196.45:10091${data.rows[i].cover}"/>
									<div>
										<p class="mui-ellipsis-2">${data.rows[i].title}</p>
										<p>${data.rows[i].publishDate}</p>
									</div>
								</div>
							`
						
					}
					document.getElementById("liss").innerHTML = html
				},
				error:function(xhr,type,errorThrown){
					
				}
			});
					
			function onGnItem(id){
				console.log(id);
				//缓存id
				window.localStorage.setItem("id",id)
				//跳转页面
				window.location.href = "xwxiang.html"
			}
		
		</script>
	</body>

</html>
